<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeatherLLM — Live NWS Pipeline</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#eaf0f8; --bg2:#dbe6f4;
  --surface:#fff; --surface-2:#f5f8fc; --surface-glass:rgba(255,255,255,.72);
  --border:#dae2ee; --border-soft:#e7edf6;
  --text:#141d2b; --dim:#57677d; --faint:#8394aa;
  --accent:#2f6fd0; --accent-2:#5b9bf0; --accent-soft:#e6eefc;
  --hot:#e0524d; --warm:#e8873a; --mild:#3fa88a; --cool:#4b9fd5; --cold:#6b7fd7;
  --sev-Extreme:#a72330; --sev-Severe:#e0524d; --sev-Moderate:#e8873a; --sev-Minor:#c9a227;
  --r:16px; --r-sm:11px;
  --sh-1:0 1px 2px rgba(20,29,43,.05);
  --sh-2:0 2px 4px rgba(20,29,43,.04),0 10px 28px rgba(20,29,43,.07);
  --sh-3:0 8px 16px rgba(20,29,43,.06),0 24px 56px rgba(20,29,43,.12);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sky-a:#7ab4ea; --sky-b:#a9d2f2; --sky-c:#dfeaf7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b111a; --bg2:#121c2a;
    --surface:#141d2a; --surface-2:#1a2432; --surface-glass:rgba(20,29,42,.72);
    --border:#26334a; --border-soft:#1f2b3e;
    --text:#e9eff8; --dim:#93a4ba; --faint:#68798f;
    --accent:#5b9bf0; --accent-2:#7db4ff; --accent-soft:#182740;
    --sh-1:0 1px 2px rgba(0,0,0,.35);
    --sh-2:0 2px 4px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.32);
    --sh-3:0 8px 16px rgba(0,0,0,.35),0 24px 56px rgba(0,0,0,.45);
    --sky-a:#16304f; --sky-b:#1d3f66; --sky-c:#0f1d2e;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
}

/* ============================================================
   ANIMATED SKY + PARTICLES
   ============================================================ */
#sky{
  position:fixed;inset:0;z-index:-2;
  background:linear-gradient(165deg,var(--sky-a) 0%,var(--sky-b) 38%,var(--sky-c) 72%,var(--bg) 100%);
  background-size:100% 220%;
  animation:skyDrift 46s ease-in-out infinite alternate;
  opacity:.5;
}
@keyframes skyDrift{from{background-position:50% 0}to{background-position:50% 100%}}

/* slow drifting cloud blobs */
#sky::before,#sky::after{
  content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.32;
}
#sky::before{
  width:46vw;height:46vw;left:-10vw;top:-12vw;background:#fff;
  animation:float1 38s ease-in-out infinite alternate;
}
#sky::after{
  width:38vw;height:38vw;right:-8vw;top:8vh;background:var(--accent-2);
  animation:float2 44s ease-in-out infinite alternate;
}
@keyframes float1{from{transform:translate(0,0)}to{transform:translate(9vw,5vh)}}
@keyframes float2{from{transform:translate(0,0)}to{transform:translate(-7vw,8vh)}}

#fx{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55}

.wrap{max-width:1260px;margin:0 auto;padding:26px 22px 90px;position:relative}

/* ============================================================
   HEADER
   ============================================================ */
header{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:26px}

.mark{
  width:50px;height:50px;flex:0 0 50px;border-radius:15px;
  background:linear-gradient(145deg,var(--accent-2),var(--accent));
  display:grid;place-items:center;color:#fff;box-shadow:var(--sh-2);
  animation:markIn .7s var(--ease) both;
}
.mark svg{width:28px;height:28px;animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes markIn{from{opacity:0;transform:scale(.8) rotate(-12deg)}to{opacity:1;transform:none}}

h1{margin:0;font-size:22px;letter-spacing:-.025em;animation:slideUp .55s var(--ease) both .06s}
.sub{margin:3px 0 0;color:var(--dim);font-size:13px;animation:slideUp .55s var(--ease) both .12s}
@keyframes slideUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ============================================================
   STAT CARDS
   ============================================================ */
.stats{display:grid;gap:12px;margin-bottom:24px;grid-template-columns:repeat(auto-fit,minmax(136px,1fr))}
.stat{
  background:var(--surface-glass);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:var(--r);padding:15px 17px;
  box-shadow:var(--sh-1);position:relative;overflow:hidden;
  animation:popIn .5s var(--ease) both;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.stat::before{
  content:"";position:absolute;inset:0 auto 0 0;width:3px;
  background:linear-gradient(var(--accent-2),var(--accent));
  transform:scaleY(0);transform-origin:bottom;
  animation:growBar .7s var(--ease) both;
}
@keyframes growBar{to{transform:scaleY(1)}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.stat .value{font-size:27px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.stat .label{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.09em;margin-top:5px}

/* ============================================================
   TABS
   ============================================================ */
nav.tabs{
  display:flex;gap:3px;margin-bottom:20px;flex-wrap:wrap;position:relative;
  background:var(--surface-glass);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:13px;padding:5px;box-shadow:var(--sh-1);
  animation:slideUp .5s var(--ease) both .26s;
}
nav.tabs button{
  border:0;background:transparent;color:var(--dim);font:inherit;font-size:13px;
  padding:9px 17px;border-radius:9px;cursor:pointer;position:relative;z-index:1;
  transition:color .25s var(--ease);
}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected="true"]{color:#fff}
#glider{
  position:absolute;left:0;top:5px;height:calc(100% - 10px);border-radius:9px;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));
  transition:transform .42s var(--ease),width .42s var(--ease);
  z-index:0;box-shadow:0 3px 10px rgba(47,111,208,.32);
}

/* ============================================================
   PANELS
   ============================================================ */
.panel{display:none}
.panel.active{display:block}
.panel.active>*{animation:panelIn .45s var(--ease) both}
@keyframes panelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:17px}
input[type=text],input[type=search],select{
  font:inherit;font-size:13px;padding:10px 14px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--surface);color:var(--text);min-width:195px;
  transition:border-color .25s,box-shadow .25s,transform .25s;
}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft)}
button.action{
  font:inherit;font-size:13px;padding:10px 19px;cursor:pointer;border:1px solid transparent;
  border-radius:var(--r-sm);background:linear-gradient(135deg,var(--accent-2),var(--accent));
  color:#fff;font-weight:550;transition:transform .22s var(--ease),box-shadow .22s;
  box-shadow:0 3px 10px rgba(47,111,208,.28);
}
button.action:hover{transform:translateY(-1.5px);box-shadow:0 6px 18px rgba(47,111,208,.36)}
button.action:active{transform:translateY(0)}
button.action.ghost{background:var(--surface);color:var(--dim);border-color:var(--border);box-shadow:none}

/* ============================================================
   CITY CARDS
   ============================================================ */
.cities{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(262px,1fr))}
.city{
  background:var(--surface-glass);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:var(--r);padding:17px 18px;
  box-shadow:var(--sh-1);cursor:pointer;position:relative;overflow:hidden;
  animation:cardIn .5s var(--ease) both;
  transition:transform .34s var(--ease),box-shadow .34s var(--ease),border-color .34s;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.city:hover{transform:translateY(-5px);box-shadow:var(--sh-3);border-color:var(--band)}
.city::before{
  content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--band);
  transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease);
}
.city:hover::before{transform:scaleX(1)}
.city::after{
  content:"";position:absolute;width:150px;height:150px;right:-55px;top:-55px;border-radius:50%;
  background:var(--band);opacity:.07;transition:transform .5s var(--ease),opacity .5s;
}
.city:hover::after{transform:scale(1.5);opacity:.13}

.city .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.city .name{font-weight:620;font-size:15.5px;letter-spacing:-.015em}
.city .state{font-size:11.5px;color:var(--faint);margin-top:2px}
.city .tempwrap{display:flex;align-items:center;gap:8px}
.city .temp{font-size:31px;font-weight:640;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.city .unit{font-size:14px;color:var(--faint);font-weight:400}
.city .cond{margin-top:12px;font-size:13px;color:var(--dim);position:relative}
.city .meta{
  margin-top:11px;padding-top:11px;border-top:1px solid var(--border-soft);
  display:flex;gap:13px;font-size:11.5px;color:var(--faint);align-items:center;flex-wrap:wrap;
}
.tbar{height:3px;border-radius:2px;background:var(--border-soft);overflow:hidden;margin-top:10px}
.tbar i{display:block;height:100%;background:var(--band);width:0;border-radius:2px;
        transition:width 1.1s var(--ease) .25s}

.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:640;letter-spacing:.03em;
       background:var(--accent-soft);color:var(--accent)}
.badge.alert{background:rgba(224,82,77,.14);color:var(--hot);animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(224,82,77,.35)}50%{box-shadow:0 0 0 5px rgba(224,82,77,0)}}

/* weather icon */
.wicon{width:34px;height:34px;flex:0 0 34px;color:var(--band)}
.wicon .sun{transform-origin:center;animation:spin 26s linear infinite}
.wicon .cloud{animation:drift 5.5s ease-in-out infinite}
.wicon .drop{animation:fall 1.5s linear infinite}
.wicon .drop:nth-child(2){animation-delay:.5s}
.wicon .drop:nth-child(3){animation-delay:1s}
.wicon .flake{animation:twirl 4s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(2.5px)}}
@keyframes fall{0%{opacity:0;transform:translateY(-2px)}30%{opacity:1}100%{opacity:0;transform:translateY(7px)}}
@keyframes twirl{to{transform:rotate(360deg)}}

/* ============================================================
   TABLES
   ============================================================ */
.tablewrap{
  background:var(--surface-glass);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-1);overflow-x:auto;
}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:660px}
th{
  text-align:left;padding:12px 16px;font-size:10.5px;font-weight:640;text-transform:uppercase;
  letter-spacing:.08em;color:var(--faint);border-bottom:1px solid var(--border);
  background:var(--surface-2);position:sticky;top:0;z-index:2;
}
td{padding:12px 16px;border-bottom:1px solid var(--border-soft);vertical-align:top}
tbody tr{animation:rowIn .4s var(--ease) both;transition:background .2s}
@keyframes rowIn{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:none}}
tbody tr:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
td.narr{color:var(--dim);max-width:470px;line-height:1.55}

/* ============================================================
   ALERTS
   ============================================================ */
.alert-card{
  background:var(--surface-glass);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-left:4px solid var(--sev,var(--sev-Moderate));
  border-radius:var(--r);padding:17px 19px;margin-bottom:12px;box-shadow:var(--sh-1);
  animation:cardIn .5s var(--ease) both;position:relative;overflow:hidden;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.alert-card:hover{transform:translateX(3px);box-shadow:var(--sh-2)}
.alert-card[data-sev="Extreme"]::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(167,35,48,.09),transparent 42%);
  animation:sweep 3.4s ease-in-out infinite;
}
@keyframes sweep{0%,100%{opacity:.35}50%{opacity:1}}
.alert-card h3{margin:0 0 6px;font-size:15.5px;letter-spacing:-.015em}
.alert-meta{font-size:11.5px;color:var(--faint);margin-bottom:11px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.sevchip{padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.05em;
         text-transform:uppercase;color:#fff;background:var(--sev,var(--sev-Moderate))}
.alert-body{font-size:13px;color:var(--dim);line-height:1.65;white-space:pre-wrap;
            max-height:104px;overflow:hidden;position:relative;transition:max-height .5s var(--ease)}
.alert-body.open{max-height:2400px}
.alert-body:not(.open)::after{
  content:"";position:absolute;inset:auto 0 0 0;height:46px;
  background:linear-gradient(transparent,var(--surface));
}
.toggle{font-size:12px;color:var(--accent);cursor:pointer;margin-top:9px;display:inline-flex;
        align-items:center;gap:5px;font-weight:520}
.toggle svg{width:12px;height:12px;transition:transform .35s var(--ease)}
.toggle.open svg{transform:rotate(180deg)}

/* ============================================================
   ASK
   ============================================================ */
.ask-box{display:flex;gap:9px;margin-bottom:16px}
.ask-box input{flex:1;min-width:0;font-size:14px;padding:13px 17px}
.answer{
  background:linear-gradient(135deg,var(--accent-soft),var(--surface));
  border:1px solid var(--border);border-radius:var(--r);padding:19px 21px;margin-bottom:18px;
  box-shadow:var(--sh-1);animation:cardIn .5s var(--ease) both;position:relative;overflow:hidden;
}
.answer::before{
  content:"";position:absolute;inset:0 auto 0 0;width:3px;
  background:linear-gradient(var(--accent-2),var(--accent));
}
.answer .lab{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:8px}
.answer p{margin:0;font-size:15px;line-height:1.65}

.hit{
  background:var(--surface-glass);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:var(--r);padding:15px 17px;margin-bottom:10px;
  box-shadow:var(--sh-1);animation:cardIn .5s var(--ease) both;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.hit:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.hit .hrow{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px;align-items:center}
.hit .text{font-size:13.5px;line-height:1.6}
.hit .trace{margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);
            font-family:var(--mono);font-size:11px;color:var(--faint);word-break:break-all}
.scorebar{height:3px;background:var(--border-soft);border-radius:2px;overflow:hidden;
          margin-top:9px;width:110px}
.scorebar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));
            width:0;transition:width .9s var(--ease) .2s}
.score{font-family:var(--mono);font-size:11.5px;color:var(--accent)}

.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.suggestions button{
  font:inherit;font-size:12px;padding:7px 14px;cursor:pointer;background:var(--surface);
  border:1px solid var(--border);border-radius:999px;color:var(--dim);
  transition:all .25s var(--ease);animation:popIn .45s var(--ease) both;
}
.suggestions button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}

/* ============================================================
   SKELETONS / EMPTY
   ============================================================ */
.sk{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:17px 18px;height:150px;position:relative;overflow:hidden}
.sk::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shimmer 1.5s infinite;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .sk::after{
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);}
}
@keyframes shimmer{to{transform:translateX(100%)}}
.sk i{display:block;background:var(--surface-2);border-radius:6px;height:12px;margin-bottom:10px}
.sk i:nth-child(1){width:55%;height:16px}
.sk i:nth-child(2){width:35%}
.sk i:nth-child(3){width:75%;margin-top:24px}

.empty{padding:48px 20px;text-align:center;color:var(--faint);font-size:13.5px}
.empty svg{width:38px;height:38px;opacity:.4;margin-bottom:12px;display:block;margin-inline:auto}

/* ============================================================
   DIALOG
   ============================================================ */
dialog{
  border:1px solid var(--border);border-radius:19px;padding:0;background:var(--surface);
  color:var(--text);max-width:700px;width:calc(100% - 40px);box-shadow:var(--sh-3);
}
dialog[open]{animation:dlgIn .38s var(--ease)}
@keyframes dlgIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(10,17,26,.55);backdrop-filter:blur(4px);animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg-head{padding:19px 23px;border-bottom:1px solid var(--border);display:flex;
          justify-content:space-between;align-items:center;gap:12px}
.dlg-head h2{margin:0;font-size:18px;letter-spacing:-.02em}
.close{background:none;border:0;font-size:24px;cursor:pointer;color:var(--faint);line-height:1;
       transition:color .2s,transform .2s}
.close:hover{color:var(--text);transform:rotate(90deg)}
.dlg-body{padding:19px 23px;max-height:64vh;overflow-y:auto}
.period{padding:13px 0;border-bottom:1px solid var(--border-soft);animation:rowIn .4s var(--ease) both}
.period:last-child{border-bottom:0}
.period .ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.period .pn{font-weight:620;font-size:14px}
.period .pt{font-family:var(--mono);font-size:15px;font-weight:600}
.period .pd{font-size:13px;color:var(--dim);line-height:1.6;margin-top:6px}

footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;
       color:var(--faint);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* ============================================================
   ACCESSIBILITY — honour reduced motion
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
                       transition-duration:.01ms!important}
  #fx{display:none}
  #sky{animation:none}
}
</style>
</head>
<body>

<div id="sky"></div>
<canvas id="fx"></canvas>

<div class="wrap">

  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6-1.6A4 4 0 0 0 6 19z"/>
      </svg>
    </div>
    <div>
      <h1>WeatherLLM</h1>
      <p class="sub">Live National Weather Service data — relational tables, semantic search</p>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <nav class="tabs" role="tablist">
    <div id="glider"></div>
    <button role="tab" aria-selected="true"  data-panel="p-cities">Cities</button>
    <button role="tab" aria-selected="false" data-panel="p-forecasts">Forecasts</button>
    <button role="tab" aria-selected="false" data-panel="p-obs">Observations</button>
    <button role="tab" aria-selected="false" data-panel="p-alerts">Alerts</button>
    <button role="tab" aria-selected="false" data-panel="p-ask">Ask</button>
  </nav>

  <section class="panel active" id="p-cities">
    <div class="toolbar">
      <input type="search" id="citySearch" placeholder="Filter cities or states…">
      <select id="stateFilter"><option value="">All states</option></select>
      <select id="citySort">
        <option value="name">Sort: name</option>
        <option value="warm">Sort: warmest</option>
        <option value="cold">Sort: coldest</option>
      </select>
      <button class="action ghost" id="cityReset">Reset</button>
    </div>
    <div class="cities" id="cityGrid"></div>
  </section>

  <section class="panel" id="p-forecasts">
    <div class="toolbar">
      <input type="search" id="fcSearch" placeholder="Search forecast narratives…">
      <select id="fcLocation"><option value="">All locations</option></select>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Location</th><th>Period</th><th class="num">Temp</th><th>Wind</th><th>Narrative</th></tr></thead>
        <tbody id="fcBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="p-obs">
    <div class="toolbar"><select id="obLocation"><option value="">All locations</option></select></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Location</th><th>Station</th><th>Observed</th><th class="num">°C</th><th class="num">RH %</th><th class="num">Wind</th><th>Conditions</th></tr></thead>
        <tbody id="obBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="p-alerts">
    <div class="toolbar"><select id="alState"><option value="">All states</option></select></div>
    <div id="alList"></div>
  </section>

  <section class="panel" id="p-ask">
    <div class="ask-box">
      <input type="text" id="q" placeholder="Ask about conditions, forecasts or alerts…">
      <button class="action" id="askBtn">Ask</button>
    </div>
    <div class="suggestions" id="sugg"></div>
    <div id="askOut"></div>
  </section>

  <footer>
    <span>Source: api.weather.gov (NWS) · no API key</span>
    <span id="modelInfo"></span>
  </footer>
</div>

<dialog id="cityDlg">
  <div class="dlg-head">
    <h2 id="dlgTitle">City</h2>
    <button class="close" onclick="cityDlg.close()">&times;</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

let LOCATIONS=[], FORECASTS=[], OBSERVATIONS=[], ALERTS=[], STATES=[];

async function api(path, options){
  const r = await fetch(path, options);
  if(!r.ok) throw new Error(path + " → " + r.status);
  return r.json();
}

/* ---------- temperature → colour band ---------- */
const c2f = c => c==null ? null : c*9/5+32;
function band(c){
  if(c==null) return "var(--faint)";
  if(c>=32) return "var(--hot)";
  if(c>=24) return "var(--warm)";
  if(c>=14) return "var(--mild)";
  if(c>=4)  return "var(--cool)";
  return "var(--cold)";
}
/* position on a -20..45C scale, for the mini bar */
const tpct = c => c==null ? 0 : Math.max(4, Math.min(100, ((c+20)/65)*100));

/* ---------- condition → animated SVG icon ---------- */
function icon(text){
  const t = (text||"").toLowerCase();
  const S = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';

  if(/thunder|storm/.test(t)) return `<svg class="wicon" ${S}>
    <path class="cloud" d="M17.5 16a4 4 0 0 0 0-8 6 6 0 0 0-11.5-1.6A3.6 3.6 0 0 0 6 16z"/>
    <path class="drop" d="M13 14l-3 5h4l-2 4"/></svg>`;

  if(/snow|flurr|sleet|winter/.test(t)) return `<svg class="wicon" ${S}>
    <path class="cloud" d="M17.5 14a4 4 0 0 0 0-8 6 6 0 0 0-11.5-1.6A3.6 3.6 0 0 0 6 14z"/>
    <g class="flake"><path d="M9 18v3M7.7 19.4l2.6 1.2M10.3 19.4l-2.6 1.2"/></g>
    <g class="flake"><path d="M15 18v3M13.7 19.4l2.6 1.2M16.3 19.4l-2.6 1.2"/></g></svg>`;

  if(/rain|shower|drizzle/.test(t)) return `<svg class="wicon" ${S}>
    <path class="cloud" d="M17.5 14a4 4 0 0 0 0-8 6 6 0 0 0-11.5-1.6A3.6 3.6 0 0 0 6 14z"/>
    <path class="drop" d="M8 17v3"/><path class="drop" d="M12 17v3.5"/><path class="drop" d="M16 17v3"/></svg>`;

  if(/fog|haze|mist|smoke/.test(t)) return `<svg class="wicon" ${S}>
    <path class="cloud" d="M17.5 12a4 4 0 0 0 0-8A6 6 0 0 0 6 5.4 3.6 3.6 0 0 0 6 12z"/>
    <path class="cloud" d="M4 16h16M6 19.5h13"/></svg>`;

  if(/cloud|overcast/.test(t)){
    const partly = /partly|few|mostly sunny|scattered/.test(t);
    return `<svg class="wicon" ${S}>
      ${partly ? '<circle class="sun" cx="8" cy="7.5" r="3"/>' : ''}
      <path class="cloud" d="M17.5 18a4.2 4.2 0 0 0 0-8.4A6.2 6.2 0 0 0 5.8 8 3.8 3.8 0 0 0 6 18z"/></svg>`;
  }

  /* clear / sunny / fair — default */
  return `<svg class="wicon" ${S}><g class="sun">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
  </g></svg>`;
}

/* ---------- count-up numbers ---------- */
function countUp(el, target, decimals=0, suffix=""){
  if(REDUCED || target==null){ el.textContent = (target ?? "—") + suffix; return; }
  const dur = 900, t0 = performance.now();
  (function tick(now){
    const p = Math.min((now-t0)/dur, 1);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = (target*eased).toFixed(decimals) + suffix;
    if(p < 1) requestAnimationFrame(tick);
  })(t0);
}

/* ============================================================
   PARTICLE LAYER — driven by the actual dominant condition
   ============================================================ */
const fx = $("#fx"), ctx = fx.getContext("2d");
let particles = [], mode = "none", raf = null;

function sizeCanvas(){ fx.width = innerWidth; fx.height = innerHeight; }
addEventListener("resize", sizeCanvas); sizeCanvas();

function setWeatherMode(conditions){
  if(REDUCED) return;
  const all = conditions.join(" ").toLowerCase();
  const rain = (all.match(/rain|shower|drizzle|thunder/g)||[]).length;
  const snow = (all.match(/snow|flurr|sleet/g)||[]).length;

  mode = snow > rain && snow > 0 ? "snow" : rain > 0 ? "rain" : "none";

  const count = mode==="snow" ? 60 : mode==="rain" ? 90 : 0;
  particles = Array.from({length:count}, () => spawn());

  if(raf) cancelAnimationFrame(raf);
  if(mode !== "none") loop(); else ctx.clearRect(0,0,fx.width,fx.height);
}

function spawn(){
  return {
    x: Math.random()*fx.width,
    y: Math.random()*fx.height,
    len: mode==="snow" ? 1.6+Math.random()*2 : 8+Math.random()*11,
    v:   mode==="snow" ? .35+Math.random()*.7 : 3.5+Math.random()*4,
    drift: mode==="snow" ? (Math.random()-.5)*.5 : .5,
    o: .25+Math.random()*.4,
  };
}

function loop(){
  ctx.clearRect(0,0,fx.width,fx.height);
  const colour = getComputedStyle(document.body).getPropertyValue("--accent").trim();

  for(const p of particles){
    ctx.globalAlpha = p.o;
    if(mode==="snow"){
      ctx.fillStyle = colour;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.len, 0, 7); ctx.fill();
    } else {
      ctx.strokeStyle = colour; ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x+p.drift*2, p.y+p.len); ctx.stroke();
    }
    p.y += p.v; p.x += p.drift;
    if(p.y > fx.height){ p.y = -12; p.x = Math.random()*fx.width; }
    if(p.x > fx.width) p.x = 0; else if(p.x < 0) p.x = fx.width;
  }
  ctx.globalAlpha = 1;
  raf = requestAnimationFrame(loop);
}

/* ============================================================
   TABS
   ============================================================ */
function moveGlider(btn){
  const g = $("#glider"), nav = btn.parentElement;
  /* btn.offsetLeft/Top are already relative to nav (its offsetParent, since
     nav is position:relative). The glider sits at left:0/top:5px of nav's
     PADDING box, so we only subtract the border width (clientLeft/clientTop)
     to line the two coordinate spaces up. Translating Y as well keeps it
     correct when the tabs wrap onto a second row on narrow screens. */
  const x = btn.offsetLeft - nav.clientLeft;
  const y = btn.offsetTop  - nav.clientTop - 5;
  g.style.width = btn.offsetWidth + "px";
  g.style.height = btn.offsetHeight + "px";
  g.style.transform = `translate(${x}px, ${y}px)`;
}
document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected","false"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.setAttribute("aria-selected","true");
    $("#"+btn.dataset.panel).classList.add("active");
    moveGlider(btn);
  };
});
addEventListener("resize", () => moveGlider(document.querySelector('[aria-selected="true"]')));

/* ============================================================
   HEALTH + STATS
   ============================================================ */
async function loadHealth(){
  /* The status pills were removed from the header. Health is still fetched
     so the footer can report which model built the index; problems surface
     where they matter instead — the grid shows a load error, and /api/ask
     reports keyword-fallback mode inline. */
  try{
    const h = await api("/api/health");
    const m = h.manifest || {};
    if(m.embedding_model)
      $("#modelInfo").textContent = `${m.embedding_model} · ${m.vectors} vectors · ${m.index_type}`;
    if(!h.vector_index)
      console.warn("Vector index missing — /api/ask will fall back to keyword search.");
  }catch(e){
    console.warn("Health check failed:", e.message);
  }
}

async function loadStats(){
  const s = await api("/api/stats");
  const cards = [
    [s.locations,"Cities",0,""], [s.forecasts,"Forecast periods",0,""],
    [s.observations,"Observations",0,""], [s.alerts,"Active alerts",0,""],
    [s.stations,"Stations",0,""], [s.states,"States",0,""],
  ];
  if(s.temp_max_c!=null){
    cards.push([s.temp_max_c,"Warmest now",0,"°"], [s.temp_min_c,"Coldest now",0,"°"]);
  }

  $("#stats").innerHTML = cards.map((c,i)=>
    `<div class="stat" style="animation-delay:${i*55}ms">
       <div class="value" data-v="${c[0]}" data-d="${c[2]}" data-s="${c[3]}">0</div>
       <div class="label">${c[1]}</div></div>`).join("");

  document.querySelectorAll(".stat .value").forEach((el,i)=>{
    const v = parseFloat(el.dataset.v);
    setTimeout(()=>countUp(el, isNaN(v)?null:v, +el.dataset.d, el.dataset.s), 260 + i*55);
    if(el.dataset.s==="°") el.style.color = band(v);
  });
}

/* ============================================================
   CITIES
   ============================================================ */
function renderCities(){
  const term = $("#citySearch").value.toLowerCase();
  const state = $("#stateFilter").value;
  const sort = $("#citySort").value;

  let rows = LOCATIONS.filter(l =>
    (!state || l.stateCode===state) &&
    (!term || (l.name+" "+l.stateCode+" "+(l.stateName||"")).toLowerCase().includes(term)));

  const t = l => l.temperatureC ?? -999;
  if(sort==="warm") rows = [...rows].sort((a,b)=>t(b)-t(a));
  else if(sort==="cold") rows = [...rows].sort((a,b)=>t(a)-t(b));
  else rows = [...rows].sort((a,b)=>a.name.localeCompare(b.name));

  if(!rows.length){
    $("#cityGrid").innerHTML = `<div class="empty" style="grid-column:1/-1">No cities match that filter.</div>`;
    return;
  }

  $("#cityGrid").innerHTML = rows.map((l,i)=>{
    const c = l.temperatureC, f = c2f(c);
    return `<div class="city" style="--band:${band(c)};animation-delay:${Math.min(i*45,700)}ms"
                 onclick="openCity('${esc(l.idLocation)}')">
      <div class="top">
        <div>
          <div class="name">${esc(l.name)}</div>
          <div class="state">${esc(l.stateName||l.stateCode)} · ${esc(l.idStation||"no station")}</div>
        </div>
        <div class="tempwrap">
          ${icon(l.textDescription)}
          <div class="temp" style="color:${band(c)}">${c==null?"—":c.toFixed(0)}<span class="unit">°C</span></div>
        </div>
      </div>
      <div class="cond">${esc(l.textDescription||"No current observation")}
        ${f==null?"":`<span style="color:var(--faint)"> · ${f.toFixed(0)}°F</span>`}</div>
      <div class="tbar"><i data-w="${tpct(c)}"></i></div>
      <div class="meta">
        <span>${l.forecastCount||0} periods</span>
        <span>${l.humidity==null?"—":l.humidity.toFixed(0)+"% RH"}</span>
        ${l.alertCount?`<span class="badge alert">${l.alertCount} alert${l.alertCount>1?"s":""}</span>`:""}
      </div></div>`;
  }).join("");

  requestAnimationFrame(()=>document.querySelectorAll(".tbar i")
    .forEach(el=>el.style.width = el.dataset.w+"%"));
}

async function openCity(id){
  const d = $("#cityDlg");
  $("#dlgTitle").textContent = "Loading…";
  $("#dlgBody").innerHTML = `<div class="sk"><i></i><i></i><i></i></div>`;
  d.showModal();

  const x = await api("/api/locations/"+encodeURIComponent(id));
  $("#dlgTitle").textContent = `${x.name}, ${x.stateCode}`;

  const head = `<p style="font-size:12px;color:var(--faint);margin:0 0 15px">
      NWS office ${esc(x.idOffice)} · grid ${x.gridX},${x.gridY}
      · ${x.latitude?.toFixed(3)}, ${x.longitude?.toFixed(3)}</p>`;

  const alerts = x.alerts?.length
    ? `<div style="margin-bottom:16px">${x.alerts.map(a=>
        `<span class="badge alert" style="margin:0 6px 6px 0">${esc(a.event)}</span>`).join("")}</div>` : "";

  const periods = (x.forecasts||[]).map((p,i)=>`
    <div class="period" style="animation-delay:${i*45}ms">
      <div class="ph">
        <span class="pn">${esc(p.periodName)}</span>
        <span class="pt" style="color:${band((p.temperature-32)*5/9)}">${p.temperature ?? "—"}°${esc(p.temperatureUnit||"")}</span>
      </div>
      <div class="pd">${esc(p.detailedForecast)}</div>
    </div>`).join("") || `<div class="empty">No forecast periods loaded.</div>`;

  $("#dlgBody").innerHTML = head + alerts + periods;
}

/* ============================================================
   FORECASTS / OBSERVATIONS
   ============================================================ */
function renderForecasts(){
  const term = $("#fcSearch").value.toLowerCase();
  const loc = $("#fcLocation").value;
  const rows = FORECASTS.filter(f =>
    (!loc || f.idLocation===loc) &&
    (!term || ((f.detailedForecast||"")+" "+f.location).toLowerCase().includes(term))).slice(0,300);

  $("#fcBody").innerHTML = rows.length ? rows.map((f,i)=>`
    <tr style="animation-delay:${Math.min(i*11,600)}ms">
      <td><strong>${esc(f.location)}</strong><br><span style="font-size:11px;color:var(--faint)">${esc(f.stateCode)}</span></td>
      <td>${esc(f.periodName)}</td>
      <td class="num">${f.temperature ?? "—"}°${esc(f.temperatureUnit||"")}</td>
      <td style="font-size:12px;color:var(--dim)">${esc(f.windSpeed||"—")}</td>
      <td class="narr">${esc(f.detailedForecast)}</td></tr>`).join("")
    : `<tr><td colspan="5"><div class="empty">No forecasts match.</div></td></tr>`;
}

function renderObservations(){
  const loc = $("#obLocation").value;
  const rows = OBSERVATIONS.filter(o=>!loc||o.idLocation===loc).slice(0,300);

  $("#obBody").innerHTML = rows.length ? rows.map((o,i)=>`
    <tr style="animation-delay:${Math.min(i*11,600)}ms">
      <td><strong>${esc(o.location)}</strong> <span style="color:var(--faint)">${esc(o.stateCode)}</span></td>
      <td style="font-family:var(--mono);font-size:12px">${esc(o.idStation)}</td>
      <td style="font-size:12px;color:var(--dim)">${esc((o.observedAt||"").replace("T"," ").slice(0,16))}</td>
      <td class="num" style="color:${band(o.temperatureC)};font-weight:600">${o.temperatureC==null?"—":o.temperatureC.toFixed(1)}</td>
      <td class="num">${o.humidity==null?"—":o.humidity.toFixed(0)}</td>
      <td class="num">${o.windSpeedKmh==null?"—":o.windSpeedKmh.toFixed(0)}</td>
      <td style="font-size:12px;color:var(--dim)">${esc(o.textDescription||"—")}</td></tr>`).join("")
    : `<tr><td colspan="7"><div class="empty">No observations loaded.</div></td></tr>`;
}

/* ============================================================
   ALERTS
   ============================================================ */
function renderAlerts(){
  const state = $("#alState").value;
  const rows = ALERTS.filter(a=>!state||a.stateCode===state);

  if(!rows.length){
    $("#alList").innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
      No active alerts anywhere in the tracked states.<br>
      <span style="font-size:12px">Calm weather — a valid state the pipeline handles explicitly, not a failure.</span></div>`;
    return;
  }

  $("#alList").innerHTML = rows.map((a,i)=>`
    <div class="alert-card" data-sev="${esc(a.severity)}"
         style="--sev:var(--sev-${esc(a.severity||"Moderate")});animation-delay:${Math.min(i*60,600)}ms">
      <h3>${esc(a.event)}</h3>
      <div class="alert-meta">
        <span class="sevchip">${esc(a.severity||"—")}</span>
        <span>${esc(a.stateName||a.stateCode)}</span>
        <span>·</span><span>${esc(a.urgency||"")}</span>
        <span>·</span><span>expires ${esc((a.expires||"").replace("T"," ").slice(0,16))}</span>
      </div>
      <div style="font-size:12.5px;color:var(--dim);margin-bottom:10px">${esc(a.areaDesc)}</div>
      <div class="alert-body" id="ab${i}">${esc(a.description||"")}${a.instruction?"\n\nWHAT TO DO: "+esc(a.instruction):""}</div>
      <span class="toggle" onclick="toggleAlert(this,'ab${i}')">Show more
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></span>
    </div>`).join("");
}

function toggleAlert(el, id){
  const body = document.getElementById(id);
  body.classList.toggle("open");
  el.classList.toggle("open");
  el.childNodes[0].nodeValue = body.classList.contains("open") ? "Show less " : "Show more ";
}

/* ============================================================
   ASK
   ============================================================ */
const SUGGESTIONS = ["will it rain in Seattle","where is it hottest right now",
  "any flood warnings","what should I do in a thunderstorm","is snow expected"];

$("#sugg").innerHTML = SUGGESTIONS.map((s,i)=>
  `<button style="animation-delay:${i*55}ms" onclick="ask('${s.replace(/'/g,"\\'")}')">${esc(s)}</button>`).join("");

async function ask(question){
  if(question) $("#q").value = question;
  const v = $("#q").value.trim();
  if(!v) return;

  $("#askOut").innerHTML = `<div class="sk"><i></i><i></i><i></i></div>`;

  try{
    const d = await api("/api/ask",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:v, top_k:5})});

    let html = `<div class="answer">
        <div class="lab">Answer · ${esc(d.mode)} retrieval</div>
        <p>${esc(d.answer)}</p></div>`;

    if(d.note) html += `<div style="font-size:12px;color:var(--warm);margin-bottom:12px">${esc(d.note)}</div>`;

    html += (d.results||[]).map((r,i)=>`
      <div class="hit" style="animation-delay:${i*70}ms">
        <div class="hrow">
          <span class="badge">${esc(r.metadata.doc_type||"chunk")}</span>
          <span class="score">${r.score==null?"":"cosine "+r.score}</span>
        </div>
        <div class="text">${esc(r.text)}</div>
        ${r.score==null?"":`<div class="scorebar"><i data-w="${Math.max(0,Math.min(100,r.score*100))}"></i></div>`}
        <div class="trace">${esc(r.metadata.source_table)} → ${esc(r.metadata.source_id)}</div>
      </div>`).join("");

    if(!(d.results||[]).length)
      html += `<div class="empty">Nothing scored above the relevance threshold.</div>`;

    $("#askOut").innerHTML = html;
    requestAnimationFrame(()=>document.querySelectorAll(".scorebar i")
      .forEach(el=>el.style.width = el.dataset.w+"%"));
  }catch(e){
    $("#askOut").innerHTML = `<div class="empty">Search failed: ${esc(e.message)}</div>`;
  }
}

$("#askBtn").onclick = ()=>ask();
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter") ask(); });

/* ---------- filters ---------- */
$("#citySearch").addEventListener("input", renderCities);
$("#stateFilter").addEventListener("change", renderCities);
$("#citySort").addEventListener("change", renderCities);
$("#cityReset").onclick = ()=>{ $("#citySearch").value=""; $("#stateFilter").value="";
                                $("#citySort").value="name"; renderCities(); };
$("#fcSearch").addEventListener("input", renderForecasts);
$("#fcLocation").addEventListener("change", renderForecasts);
$("#obLocation").addEventListener("change", renderObservations);
$("#alState").addEventListener("change", renderAlerts);

/* ============================================================
   BOOT
   ============================================================ */
$("#cityGrid").innerHTML = Array.from({length:8},()=>
  `<div class="sk"><i></i><i></i><i></i></div>`).join("");

(async function boot(){
  moveGlider(document.querySelector('[aria-selected="true"]'));
  await loadHealth();

  try{
    await loadStats();

    [LOCATIONS,FORECASTS,OBSERVATIONS,ALERTS,STATES] = await Promise.all([
      api("/api/locations"), api("/api/forecasts?limit=2000"),
      api("/api/observations?limit=1000"), api("/api/alerts"), api("/api/states"),
    ]);

    const locOpts = LOCATIONS.map(l=>
      `<option value="${esc(l.idLocation)}">${esc(l.name)}, ${esc(l.stateCode)}</option>`).join("");
    $("#fcLocation").insertAdjacentHTML("beforeend", locOpts);
    $("#obLocation").insertAdjacentHTML("beforeend", locOpts);

    $("#stateFilter").insertAdjacentHTML("beforeend", STATES.filter(s=>s.locations>0)
      .map(s=>`<option value="${esc(s.code)}">${esc(s.name)}</option>`).join(""));
    $("#alState").insertAdjacentHTML("beforeend", STATES.filter(s=>s.alerts>0)
      .map(s=>`<option value="${esc(s.code)}">${esc(s.name)} (${s.alerts})</option>`).join(""));

    renderCities(); renderForecasts(); renderObservations(); renderAlerts();

    /* particle layer reflects the real dominant condition */
    setWeatherMode(LOCATIONS.map(l=>l.textDescription||"")
      .concat(ALERTS.map(a=>a.event||"")));
  }catch(e){
    $("#cityGrid").innerHTML = `<div class="empty" style="grid-column:1/-1">
      Could not load data: ${esc(e.message)}<br><br>
      Run the pipeline first: <code>python src/pipeline.py</code></div>`;
  }
})();
</script>
</body>
</html>
